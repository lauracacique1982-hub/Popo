name: secure-rdp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rdp-access:
    runs-on: windows-latest  # Necesitas Windows para RDP

    steps:
      - name: Iniciar sesión y conectar Tailscale
        run: |
          # Iniciar sesión con la clave
          tailscale up --authkey $env:TAILSCALE_AUTH_KEY --timeout 60s
          
          # Esperar conexión
          Start-Sleep -Seconds 8
          
          # Obtener la IP
          $tsIP = (tailscale ip -4)
          
          if (-not $tsIP) {
            Write-Error "❌ No se obtuvo IP de Tailscale"
            exit 1
          }
          
          Write-Host "✅ IP obtenida: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Verificar conexión RDP
        run: |
          Write-Host "Probando IP: $env:TAILSCALE_IP"
          # Probar PUERTO 3389 (RDP)
          $con = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          
          if (-not $con.TcpTestSucceeded) {
            Write-Error "❌ No se puede conectar al puerto 3389"
            exit 1
          }
          
          Write-Host "✅ Conexión RDP exitosa"

      - name: Mantener sesión activa
        run: |
          Write-Host "`n=== ACCESO RDP ==="
          Write-Host "Dirección: $env:TAILSCALE_IP"
          Write-Host "Usuario: YamzzOfficial"
          Write-Host "Contraseña: [Guardada en Secretos]"
          Write-Host "==================`n"
          
          # Mantener vivo
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Sesión activa ✅"
            Start-Sleep -Seconds 300  # Repite cada 5 min
          }
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
 
